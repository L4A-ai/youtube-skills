name: validate-skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Enforce telemetry-free maintainer checks
        run: node .github/scripts/check-ci-telemetry.mjs

      - name: Validate Agent Plugins v1 and Agent Skills
        env:
          PLUGIN_SCHEMA_SHA256: 0a4aad95ce337878ad38802ebf0daa3fde76abe3f65400c86bcbb1ec0b3ab883
          SKILLS_REF_COMMIT: 217be548739f21d6008915c29aefe320ea1a90af
        run: |
          curl --fail --silent --show-error \
            https://agent-plugins.org/schemas/1.0.0/plugin.schema.json \
            --output "$RUNNER_TEMP/plugin.schema.json"
          echo "${PLUGIN_SCHEMA_SHA256}  $RUNNER_TEMP/plugin.schema.json" | sha256sum --check --status
          npx --yes ajv-cli@5.0.0 validate --spec=draft2020 \
            -s "$RUNNER_TEMP/plugin.schema.json" \
            -d plugin.json

          test -f plugin.json
          test -d skills
          if [[ -e .codex-plugin || -L .codex-plugin ]]; then
            echo "::error::.codex-plugin is a Codex-specific package format; portable plugins require root plugin.json"
            exit 1
          fi

          mapfile -d '' tracked_skills < <(git ls-files -z -- ':(glob)**/SKILL.md')
          if (( ${#tracked_skills[@]} == 0 )); then
            echo "::error::no tracked SKILL.md files"
            exit 1
          fi
          for skill_file in "${tracked_skills[@]}"; do
            if [[ ! "$skill_file" =~ ^skills/[^/]+/SKILL\.md$ ]]; then
              echo "::error file=$skill_file::tracked SKILL.md must be exactly skills/<name>/SKILL.md"
              exit 1
            fi
          done

          plugin_root=$(realpath .)
          while IFS= read -r -d '' package_path; do
            if [[ "/$package_path/" == *"/.codex-plugin/"* ]]; then
              echo "::error file=$package_path::.codex-plugin paths are not portable Agent Plugins paths"
              exit 1
            fi
            if ! resolved=$(realpath -- "$package_path"); then
              echo "::error file=$package_path::tracked package path is dangling or cannot be resolved"
              exit 1
            fi
            case "$resolved" in
              "$plugin_root"|"$plugin_root"/*) ;;
              *) echo "::error file=$package_path::tracked package path resolves outside the plugin root: $resolved"; exit 1 ;;
            esac
          done < <(git ls-files -z)

          if [[ -e mcp.json || -L mcp.json ]]; then
            echo "::error::mcp.json requires Agent Plugins MCP validation"
            exit 1
          fi
          python3 -m venv "$RUNNER_TEMP/skills-ref"
          "$RUNNER_TEMP/skills-ref/bin/pip" install --disable-pip-version-check \
            "git+https://github.com/agentskills/agentskills.git@${SKILLS_REF_COMMIT}#subdirectory=skills-ref"
          for skill_file in "${tracked_skills[@]}"; do
            "$RUNNER_TEMP/skills-ref/bin/skills-ref" validate "${skill_file%/SKILL.md}"
          done

      - name: Repository invariants
        run: |
          cmp AGENTS.md CLAUDE.md
          test -f skills/youtube-shorts-publish/SKILL.md
          test -f skills/youtube-shorts-publish/agents/openai.yaml
          test -f skills/youtube-shorts-publish/examples/zero-publish-network-guard.mjs
          test -f skills/youtube-shorts-publish/examples/verify-zero-publish.mjs
          test -f media/youtube-zero-publish-proof.png
          python3 - <<'PY'
          import json, os
          manifest = json.load(open('skills.sh.json'))
          plugin = json.load(open('plugin.json'))
          package = json.load(open('skills/youtube-shorts-publish/package.json'))
          assert plugin['version'] == package['version'], 'plugin and skill package versions differ'
          listed = {skill for group in manifest['groupings'] for skill in group['skills']}
          on_disk = {name for name in os.listdir('skills') if os.path.isdir(f'skills/{name}')}
          assert listed == on_disk, f'manifest mismatch: listed={listed}, on_disk={on_disk}'
          print(f'ok: {len(listed)} skill(s)')
          PY

      - name: Zero-publish evaluator report contract
        run: ruby .github/scripts/check-zero-publish-report.rb

      - name: Skill frontmatter is minimal and complete
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for skill in Path('skills').iterdir():
              if not skill.is_dir():
                  continue
              text = (skill / 'SKILL.md').read_text()
              assert text.startswith('---\n'), f'{skill.name}: missing frontmatter'
              frontmatter = text.split('---\n', 2)[1]
              keys = []
              for line in frontmatter.splitlines():
                  if line and not line[0].isspace() and ':' in line:
                      keys.append(line.split(':', 1)[0])
              assert keys == ['name', 'description'], f'{skill.name}: frontmatter keys are {keys}'
              assert f'name: {skill.name}\n' in frontmatter, f'{skill.name}: name mismatch'
              assert '[TODO' not in text, f'{skill.name}: unresolved TODO'
              print(f'ok: {skill.name}')
          PY

      - name: CLI syntax and offline tests
        working-directory: skills/youtube-shorts-publish
        run: |
          npm run check
          npm test

      - name: Install FFmpeg for media smoke test
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Real zero-input proof is deterministic and stays local
        working-directory: skills/youtube-shorts-publish
        run: |
          first=$(node examples/verify-zero-publish.mjs)
          second=$(node examples/verify-zero-publish.mjs)
          test "$first" = "$second"
          expected=$(python3 - <<'PY'
          from pathlib import Path
          text = Path('../../README.md').read_text()
          marker = 'Expected stdout (one line):\n\n```json\n'
          print(text.split(marker, 1)[1].split('\n```', 1)[0])
          PY
          )
          test "$first" = "$expected"
          python3 - "$first" <<'PY'
          import json, sys
          result = json.loads(sys.argv[1])
          assert result['schema_version'] == '1.0'
          assert result['skill_version'] == '0.1.0'
          assert result['inspection']['shorts_candidate'] is True
          assert result['plan']['safe_to_publish'] is True
          assert result['plan']['privacy'] == 'private'
          assert result['plan']['executed'] is False
          assert result['safety'] == {
              'oauth_used': False,
              'network_guard_armed': True,
              'network_requests': 0,
              'youtube_writes': 0,
              'plan_local_writes': 0,
              'config_dir_created': False,
              'credential_files_created': False,
              'temporary_fixture_written': True,
              'temporary_artifacts_removed': True,
          }
          assert result['passed'] is True
          print('ok: real zero-input proof passed twice with identical output')
          PY

      - name: No credentials or operator media committed
        run: |
          fail=0
          while IFS= read -r file; do
            echo "::error::credential- or media-shaped file tracked: $file"
            fail=1
          done < <(git ls-files | grep -iE '(^|/)\.env($|\.)|(^|/)(operations?|[^/]*(credential|secret|token|session)[^/]*)(/|$)|audit\.jsonl$|\.(pem|key|mp4|mov|mkv|webm)$' || true)
          if git grep -nIE '"(refresh_token|access_token|client_secret)"[[:space:]]*:[[:space:]]*"[^<{[:space:]]{8,}"' -- \
            ':!.github/workflows/validate-skills.yml' >/dev/null 2>&1; then
            echo "::error::possible OAuth material in tracked content"
            fail=1
          fi
          if git grep -nIE '(YOUTUBE_CLIENT_SECRET|YOUTUBE_REFRESH_TOKEN|YTSHORTS_ACCESS_TOKEN)[[:space:]]*=[[:space:]]*[^<{[:space:]]{8,}|Bearer[[:space:]]+ya29\.[A-Za-z0-9_-]+' -- \
            ':!.github/workflows/validate-skills.yml' >/dev/null 2>&1; then
            echo "::error::possible OAuth environment value in tracked content"
            fail=1
          fi
          test $fail -eq 0
          echo "ok: no credentials or operator media tracked"

      - name: Skill installs and runs as a self-contained artifact
        run: |
          work=$(mktemp -d)
          git clone --depth 1 --quiet "$GITHUB_WORKSPACE" "$work/repo"
          cd "$work"
          npx --yes skills add "./repo" --skill youtube-shorts-publish --agent claude-code --yes 2>&1 | tee out.txt
          grep -q "Installation complete" out.txt
          installed=.claude/skills/youtube-shorts-publish
          for file in SKILL.md agents/openai.yaml package.json scripts/ytshorts.mjs \
            scripts/ytshorts-lib.mjs scripts/ytshorts-api.mjs scripts/ytshorts-state.mjs \
            examples/zero-publish-network-guard.mjs examples/verify-zero-publish.mjs \
            references/oauth-setup.md references/youtube-api-and-shorts.md \
            references/media-preparation.md; do
            test -f "$installed/$file" || { echo "::error::installed skill missing $file"; exit 1; }
          done
          "$RUNNER_TEMP/skills-ref/bin/skills-ref" validate "$installed"
          node "$installed/scripts/ytshorts.mjs" --help | grep -q "ytshorts"
          (cd "$installed" && npm test)
          proof=$(cd "$installed" && node examples/verify-zero-publish.mjs)
          python3 - "$proof" <<'PY'
          import json, sys
          result = json.loads(sys.argv[1])
          assert result['passed'] is True
          assert result['safety']['network_guard_armed'] is True
          assert result['safety']['network_requests'] == 0
          assert result['safety']['youtube_writes'] == 0
          assert result['safety']['temporary_artifacts_removed'] is True
          print('ok: installed zero-input proof passed')
          PY
          echo "ok: installed skill is self-contained"
