name: validate-skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Validate Agent Plugins v1 and Agent Skills
        env:
          PLUGIN_SCHEMA_SHA256: 0a4aad95ce337878ad38802ebf0daa3fde76abe3f65400c86bcbb1ec0b3ab883
          SKILLS_REF_COMMIT: 217be548739f21d6008915c29aefe320ea1a90af
        run: |
          curl --fail --silent --show-error \
            https://agent-plugins.org/schemas/1.0.0/plugin.schema.json \
            --output "$RUNNER_TEMP/plugin.schema.json"
          echo "${PLUGIN_SCHEMA_SHA256}  $RUNNER_TEMP/plugin.schema.json" | sha256sum --check --status
          npx --yes ajv-cli@5.0.0 validate --spec=draft2020 \
            -s "$RUNNER_TEMP/plugin.schema.json" \
            -d plugin.json
          plugin_root=$(realpath .)
          for package_path in plugin.json skills skills/*/SKILL.md; do
            resolved=$(realpath "$package_path")
            case "$resolved" in
              "$plugin_root"|"$plugin_root"/*) ;;
              *) echo "::error::$package_path escapes the plugin root"; exit 1 ;;
            esac
          done
          test -f plugin.json
          test -d skills
          test ! -e mcp.json || { echo "::error::mcp.json requires Agent Plugins MCP validation"; exit 1; }
          python3 -m venv "$RUNNER_TEMP/skills-ref"
          "$RUNNER_TEMP/skills-ref/bin/pip" install --disable-pip-version-check \
            "git+https://github.com/agentskills/agentskills.git@${SKILLS_REF_COMMIT}#subdirectory=skills-ref"
          for skill_dir in skills/*; do
            test -d "$skill_dir" || continue
            "$RUNNER_TEMP/skills-ref/bin/skills-ref" validate "$skill_dir"
          done

      - name: Repository invariants
        run: |
          cmp AGENTS.md CLAUDE.md
          test -f skills/youtube-shorts-publish/SKILL.md
          test -f skills/youtube-shorts-publish/agents/openai.yaml
          python3 - <<'PY'
          import json, os
          manifest = json.load(open('skills.sh.json'))
          listed = {skill for group in manifest['groupings'] for skill in group['skills']}
          on_disk = {name for name in os.listdir('skills') if os.path.isdir(f'skills/{name}')}
          assert listed == on_disk, f'manifest mismatch: listed={listed}, on_disk={on_disk}'
          print(f'ok: {len(listed)} skill(s)')
          PY

      - name: Zero-publish evaluator report contract
        run: |
          ruby <<'RUBY'
          require "yaml"

          def gate(condition, message)
            abort "zero-publish report contract: #{message}" unless condition
          end

          template_path = ".github/ISSUE_TEMPLATE/zero-publish-evaluation.yml"
          form = YAML.safe_load(File.read(template_path), aliases: false)
          gate(form.is_a?(Hash), "issue form must parse as a mapping")
          gate(form["labels"] == ["tester-report"], "form must apply only tester-report")

          body = form.fetch("body")
          ids = body.map { |item| item["id"] }.compact
          fields = body.each_with_object({}) do |item, indexed|
            indexed[item.fetch("id")] = item if item["id"]
          end
          gate(fields.length == ids.length, "field ids must be unique")

          completion = fields.fetch("completion")
          completion_options = completion.fetch("attributes").fetch("options")
          gate(completion["type"] == "dropdown", "completion must be a dropdown")
          gate(completion.dig("attributes", "label") == "Evaluation completion", "completion heading changed")
          gate(completion_options == [
            "Installed and ran the zero-publish evaluation",
            "Installed, but did not run the evaluation",
            "Installation or evaluation failed before completion"
          ], "completion states changed")
          gate(!completion.fetch("attributes").key?("default"), "completion must require an explicit choice")
          gate(completion.dig("validations", "required") == true, "completion must be required")

          expected = fields.fetch("expected-fields")
          gate(expected["type"] == "dropdown", "expected-fields must be a dropdown")
          gate(expected.dig("attributes", "label") == "Did every expected field match?", "expected-fields heading changed")
          gate(expected.fetch("attributes").fetch("options") == [
            "Yes - all expected fields matched",
            "No - one or more expected fields differed",
            "Not checked - evaluation did not complete"
          ], "expected-fields choices changed")
          gate(!expected.fetch("attributes").key?("default"), "expected-fields must require an explicit choice")
          gate(expected.dig("validations", "required") == true, "expected-fields must be required")

          %w[mismatch observed-evidence environment].each do |id|
            gate(fields.fetch(id).dig("validations", "required") == true, "#{id} must be required")
          end

          safety = fields.fetch("safety-and-integrity")
          safety_options = safety.fetch("attributes").fetch("options")
          gate(safety["type"] == "checkboxes", "safety-and-integrity must use checkboxes")
          gate(safety_options.length == 4, "four safety and integrity confirmations are required")
          gate(safety_options.all? { |option| option["required"] == true }, "every safety confirmation must be required")
          safety_text = safety_options.map { |option| option.fetch("label") }.join("\n")
          %w[OAuth upload privacy independent].each do |term|
            gate(safety_text.downcase.include?(term.downcase), "safety confirmations must mention #{term}")
          end

          intro = body.select { |item| item["type"] == "markdown" }
            .map { |item| item.dig("attributes", "value") }.compact.join("\n")
          gate(intro.include?("Only a report that explicitly selects **Installed and ran the zero-publish evaluation** is count-eligible"),
            "count eligibility must stay fail-closed")
          gate(intro.include?("label alone is not evidence"), "tester-report label must not imply completion")

          readme = File.read("README.md")
          gate(readme.include?("issues/new?template=zero-publish-evaluation.yml"), "README must link the form")
          gate(readme.include?("Only a report that explicitly selects **Installed and ran the zero-publish"),
            "README must state the count rule")

          puts "ok: zero-publish issue form is parseable and count eligibility is explicit"
          RUBY

      - name: Skill frontmatter is minimal and complete
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for skill in Path('skills').iterdir():
              if not skill.is_dir():
                  continue
              text = (skill / 'SKILL.md').read_text()
              assert text.startswith('---\n'), f'{skill.name}: missing frontmatter'
              frontmatter = text.split('---\n', 2)[1]
              keys = []
              for line in frontmatter.splitlines():
                  if line and not line[0].isspace() and ':' in line:
                      keys.append(line.split(':', 1)[0])
              assert keys == ['name', 'description'], f'{skill.name}: frontmatter keys are {keys}'
              assert f'name: {skill.name}\n' in frontmatter, f'{skill.name}: name mismatch'
              assert '[TODO' not in text, f'{skill.name}: unresolved TODO'
              print(f'ok: {skill.name}')
          PY

      - name: CLI syntax and offline tests
        working-directory: skills/youtube-shorts-publish
        run: |
          npm run check
          npm test

      - name: Install FFmpeg for media smoke test
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Real ffprobe smoke test stays local
        working-directory: skills/youtube-shorts-publish
        run: |
          work=$(mktemp -d)
          ffmpeg -hide_banner -loglevel error \
            -f lavfi -i color=c=black:s=360x640:d=1 \
            -f lavfi -i anullsrc=r=48000:cl=stereo \
            -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac "$work/fixture.mp4"
          node scripts/ytshorts.mjs inspect "$work/fixture.mp4" > "$work/inspect.json"
          YTSHORTS_CONFIG_DIR="$work/no-state" node scripts/ytshorts.mjs plan "$work/fixture.mp4" \
            --title "CI fixture" \
            --channel-id UCaaaaaaaaaaaaaaaaaaaaaa \
            --made-for-kids no \
            --contains-synthetic-media no > "$work/plan.json"
          python3 - "$work" <<'PY'
          import json, os, sys
          work = sys.argv[1]
          inspect = json.load(open(f'{work}/inspect.json'))
          plan = json.load(open(f'{work}/plan.json'))
          assert inspect['media']['shorts_candidate'] is True
          assert plan['plan']['safe_to_publish'] is True
          assert plan['network_requests'] == 0 and plan['local_writes'] == 0
          assert not os.path.exists(f'{work}/no-state')
          print('ok: real fixture is eligible and plan had no side effects')
          PY

      - name: No credentials or operator media committed
        run: |
          fail=0
          while IFS= read -r file; do
            echo "::error::credential- or media-shaped file tracked: $file"
            fail=1
          done < <(git ls-files | grep -iE '(^|/)\.env($|\.)|(^|/)(operations?|[^/]*(credential|secret|token|session)[^/]*)(/|$)|audit\.jsonl$|\.(pem|key|mp4|mov|mkv|webm)$' || true)
          if git grep -nIE '"(refresh_token|access_token|client_secret)"[[:space:]]*:[[:space:]]*"[^<{[:space:]]{8,}"' -- \
            ':!.github/workflows/validate-skills.yml' >/dev/null 2>&1; then
            echo "::error::possible OAuth material in tracked content"
            fail=1
          fi
          if git grep -nIE '(YOUTUBE_CLIENT_SECRET|YOUTUBE_REFRESH_TOKEN|YTSHORTS_ACCESS_TOKEN)[[:space:]]*=[[:space:]]*[^<{[:space:]]{8,}|Bearer[[:space:]]+ya29\.[A-Za-z0-9_-]+' -- \
            ':!.github/workflows/validate-skills.yml' >/dev/null 2>&1; then
            echo "::error::possible OAuth environment value in tracked content"
            fail=1
          fi
          test $fail -eq 0
          echo "ok: no credentials or operator media tracked"

      - name: Skill installs and runs as a self-contained artifact
        run: |
          work=$(mktemp -d)
          git clone --depth 1 --quiet "$GITHUB_WORKSPACE" "$work/repo"
          cd "$work"
          npx --yes skills add "./repo" --skill youtube-shorts-publish --agent claude-code --yes 2>&1 | tee out.txt
          grep -q "Installation complete" out.txt
          installed=.claude/skills/youtube-shorts-publish
          for file in SKILL.md agents/openai.yaml package.json scripts/ytshorts.mjs \
            scripts/ytshorts-lib.mjs scripts/ytshorts-api.mjs scripts/ytshorts-state.mjs \
            references/oauth-setup.md references/youtube-api-and-shorts.md \
            references/media-preparation.md; do
            test -f "$installed/$file" || { echo "::error::installed skill missing $file"; exit 1; }
          done
          node "$installed/scripts/ytshorts.mjs" --help | grep -q "ytshorts"
          (cd "$installed" && npm test)
          echo "ok: installed skill is self-contained"
